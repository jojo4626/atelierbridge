name: Publier APK signée
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version à publier, ex. v1.0.0-rc.1'
        required: true
        type: string
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'jojo4626/atelierbridge'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Préparer Android
        run: bash scripts/prepare-sdk.sh
      - name: Vérifier la version et les secrets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PINNED_CERT_SHA256: ${{ vars.ATELIERBRIDGE_CERT_SHA256 }}
          SIGNING_KEY_B64: ${{ secrets.ATELIERBRIDGE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ATELIERBRIDGE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ATELIERBRIDGE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATELIERBRIDGE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          VERSION="$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" app/build.gradle)"
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          [[ -n "$PINNED_CERT_SHA256" && -n "$SIGNING_KEY_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" && -n "$KEY_ALIAS" ]]
          umask 077
          echo "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ATELIERBRIDGE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ATELIERBRIDGE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ATELIERBRIDGE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "ATELIERBRIDGE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT_SHA256=$PINNED_CERT_SHA256" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          python3 tests/verify_project.py
          python3 tests/verify_public_release.py
          bash tests/smoke_server.sh
          bash tests/test_release_selector.sh
          bash tests/test_file_export_policy.sh
          node tests/test_photocraft_touch.cjs
          node tests/test_photocraft_file_bridge.cjs
          node tests/test_v06_export_hook.cjs
      - name: APK de diffusion
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Vérifier l'identité et la signature
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/certificate.txt"
          ACTUAL="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+).*$/\1/p' "$RUNNER_TEMP/certificate.txt" | head -n 1)"
          [[ -n "$ACTUAL" && "${ACTUAL^^}" == "${EXPECTED_CERT_SHA256^^}" ]]
          cp "$APK" AtelierBridge.apk
          sha256sum AtelierBridge.apk > AtelierBridge.sha256
      - name: Créer la version publique
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Cette version existe déjà.' >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            *-rc.*) gh release create "$RELEASE_TAG" AtelierBridge.apk AtelierBridge.sha256 --title "AtelierBridge $RELEASE_TAG" --generate-notes --prerelease --target "$GITHUB_SHA" ;;
            *) gh release create "$RELEASE_TAG" AtelierBridge.apk AtelierBridge.sha256 --title "AtelierBridge $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA" ;;
          esac
      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
