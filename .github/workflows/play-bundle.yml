name: Construire AAB Google Play (test)
on:
  workflow_dispatch:
jobs:
  play_bundle:
    if: github.repository == 'jojo4626/atelierbridge'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          bash scripts/prepare-sdk.sh
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Télécharger et vérifier les éditeurs officiels
        run: python3 scripts/fetch-play-modules.py
      - name: Vérifications statiques Google Play
        run: |
          python3 tests/verify_play_variant.py
          bash tests/smoke_server.sh
          bash tests/test_release_selector.sh
          bash tests/test_file_export_policy.sh
          node tests/test_photocraft_touch.cjs
          node tests/test_photocraft_file_bridge.cjs
      - name: Préparer la clé d'upload
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.ATELIERBRIDGE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ATELIERBRIDGE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ATELIERBRIDGE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATELIERBRIDGE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" && -n "$KEY_ALIAS" ]]
          umask 077
          printf %s "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/play-upload.p12"
          echo "ATELIERBRIDGE_KEYSTORE_FILE=$RUNNER_TEMP/play-upload.p12" >> "$GITHUB_ENV"
          echo "ATELIERBRIDGE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ATELIERBRIDGE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "ATELIERBRIDGE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Construire AAB Play
        run: gradle --no-daemon --stacktrace -PplayStore=true bundleRelease
      - name: Vérifier l'AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify -verbose "$AAB" >/dev/null
          cp "$AAB" AtelierBridge-Play.aab
          sha256sum AtelierBridge-Play.aab > AtelierBridge-Play.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AtelierBridge-Play-AAB-TEST-PRIVATE
          path: |
            AtelierBridge-Play.aab
            AtelierBridge-Play.sha256
          retention-days: 7
      - name: Effacer la clé temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.p12"
